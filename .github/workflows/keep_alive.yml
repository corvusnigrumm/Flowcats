name: Keep Alive Flowcats Render App

on:
  schedule:
    # Ejecuta cada 10 minutos para evitar el spin down de 15 minutos en Render
    - cron: "*/10 * * * *"
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App Health URL
        run: |
          curl -s -f --retry 3 --max-time 25 https://flowcats.onrender.com/health || curl -s https://flowcats.onrender.com/ping || true
          echo "Pinged Flowcats Render App successfully!"
